name: Verify

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify
        env:
          # Web build uses next/font/google (Geist, Inter) — needs network at build time.
          NEXT_TELEMETRY_DISABLED: "1"
